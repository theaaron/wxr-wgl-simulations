<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WXR Simulations</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <h1>WXR Simulations</h1>

        <div class="toggle-group">
            <button class="sel-btn active" data-structure="atria">Atria</button>
            <button class="sel-btn" data-structure="ventricle">Ventricle</button>
        </div>

        <button class="sel-btn active" data-size="large" style="display:none">Large</button>

        <button id="vr-button">Enter VR</button>
        <div id="status"></div>
    </div>

    <script>
        document.querySelectorAll('.toggle-group .sel-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.toggle-group .sel-btn')
                    .forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
    <script type="module" src="visurf-atria-mm.js"></script>
</body>
</html>
